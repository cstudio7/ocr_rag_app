<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Legal Documents</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input[type="text"] { width: 100%; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; margin-top: 10px; }
    .result { margin-top: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
  </style>
</head>
<body>

  <h1>🔍 Search Legal Knowledge Base</h1>
  <input type="text" id="queryInput" placeholder="Enter your question here">
  <button onclick="submitQuery()">Search</button>

  <div id="results"></div>

  <script>
    async function submitQuery() {
      const query = document.getElementById("queryInput").value;
      const resDiv = document.getElementById("results");
      resDiv.innerHTML = "⏳ Searching...";

      const response = await fetch("http://localhost:5000/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      
        }).catch(err => {
        console.error("❌ Fetch error:", err);
        resDiv.innerHTML = `<p style='color:red;'>Network error. Check the server.</p>`;
        return;
        });


      const data = await response.json();

      if (data.error) {
        resDiv.innerHTML = `<p style='color:red;'>${data.error}</p>`;
        return;
      }

      resDiv.innerHTML = "";
      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "result";
        div.innerHTML = `
          <b>📄 Document:</b> ${item.doc_id}<br>
          <b>📑 Page:</b> ${item.page}<br>
          <b>🧠 Score:</b> ${item.score}<br>
          <pre>${item.text}</pre>
        `;
        resDiv.appendChild(div);
      });
    }
  </script>

</body>
</html>
